    // --- Background Canvas: Matrix-Dot Grid with Ripple Effect ---
    function MatrixGridCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let animationFrameId;
        let width = 0;
        let height = 0;
        let dpr = 1;

        const SPACING = 34;
        const INFLUENCE_RADIUS = 160;
        const MAX_DISPLACEMENT = 16;
        const BASE_DOT_RADIUS = 1.25;

        const mouse = {
          x: -1000,
          y: -1000,
          targetX: -1000,
          targetY: -1000,
          active: false,
        };

        let points = [];

        const initGrid = () => {
          dpr = window.devicePixelRatio || 1;
          width = window.innerWidth;
          height = window.innerHeight;

          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;

          ctx.scale(dpr, dpr);

          points = [];
          const cols = Math.ceil(width / SPACING) + 2;
          const rows = Math.ceil(height / SPACING) + 2;

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const baseX = c * SPACING - SPACING / 2;
              const baseY = r * SPACING - SPACING / 2;
              points.push({
                baseX,
                baseY,
                x: baseX,
                y: baseY,
                phase: (c + r) * 0.25,
              });
            }
          }
        };

        initGrid();

        const handleResize = () => initGrid();
        const handleMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse.targetX = e.clientX - rect.left;
          mouse.targetY = e.clientY - rect.top;
          mouse.active = true;
        };
        const handleMouseLeave = () => {
          mouse.targetX = -1000;
          mouse.targetY = -1000;
          mouse.active = false;
        };
        const handleTouchMove = (e) => {
          if (e.touches.length > 0) {
            const rect = canvas.getBoundingClientRect();
            mouse.targetX = e.touches[0].clientX - rect.left;
            mouse.targetY = e.touches[0].clientY - rect.top;
            mouse.active = true;
          }
        };

        window.addEventListener('resize', handleResize);
        window.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseleave', handleMouseLeave);
        window.addEventListener('touchmove', handleTouchMove);

        let time = 0;
        const render = () => {
          time += 0.02;
          mouse.x += (mouse.targetX - mouse.x) * 0.12;
          mouse.y += (mouse.targetY - mouse.y) * 0.12;

          ctx.clearRect(0, 0, width, height);

          const len = points.length;
          for (let i = 0; i < len; i++) {
            const p = points[i];
            const waveX = Math.cos(time * 0.6 + p.phase) * 1.5;
            const waveY = Math.sin(time * 0.7 + p.phase) * 2.2;

            let curX = p.baseX + waveX;
            let curY = p.baseY + waveY;

            const dx = curX - mouse.x;
            const dy = curY - mouse.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            let intensity = 0;
            let dotRadius = BASE_DOT_RADIUS;
            let fillStyle = 'rgba(16, 185, 129, 0.14)';

            if (dist < INFLUENCE_RADIUS) {
              const factor = Math.cos((dist / INFLUENCE_RADIUS) * (Math.PI / 2));
              intensity = Math.pow(factor, 1.8);

              const angle = Math.atan2(dy, dx);
              const push = intensity * MAX_DISPLACEMENT;
              curX += Math.cos(angle) * push;
              curY += Math.sin(angle) * push;

              dotRadius = BASE_DOT_RADIUS + intensity * 2.2;

              const r = Math.round(16 + intensity * (163 - 16));
              const g = Math.round(185 + intensity * (230 - 185));
              const b = Math.round(129 - intensity * (129 - 53));
              const alpha = 0.2 + intensity * 0.75;
              fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha.toFixed(3)})`;
            }

            ctx.beginPath();
            ctx.arc(curX, curY, dotRadius, 0, Math.PI * 2);
            ctx.fillStyle = fillStyle;
            ctx.fill();

            if (intensity > 0.65) {
              ctx.beginPath();
              ctx.arc(curX, curY, dotRadius + 3, 0, Math.PI * 2);
              ctx.strokeStyle = `rgba(163, 230, 53, ${(intensity * 0.25).toFixed(3)})`;
              ctx.lineWidth = 1;
              ctx.stroke();
            }
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseleave', handleMouseLeave);
          window.removeEventListener('touchmove', handleTouchMove);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-none z-0"
          style={{ background: 'transparent' }}
          aria-hidden="true"
        />
      );
    }

    // --- 3D Perspective Tilt Project Card ---
    function ProjectCard({ project }) {
      const cardRef = useRef(null);
      const [tiltStyle, setTiltStyle] = useState({
        transform: 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)',
        transition: 'transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease, border-color 0.3s ease',
      });
      const [shine, setShine] = useState({ x: 50, y: 50, opacity: 0 });

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * -8.5;
        const rotateY = ((x - centerX) / centerX) * 8.5;

        setTiltStyle({
          transform: `perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) translateY(-6px)`,
          transition: 'transform 0.08s ease-out, box-shadow 0.2s ease, border-color 0.2s ease',
        });

        setShine({
          x: (x / rect.width) * 100,
          y: (y / rect.height) * 100,
          opacity: 1,
        });
      };

      const handleMouseLeave = () => {
        setTiltStyle({
          transform: 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)',
          transition: 'transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease, border-color 0.3s ease',
        });
        setShine((prev) => ({ ...prev, opacity: 0 }));
      };

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          style={tiltStyle}
          className="group relative flex flex-col justify-between rounded-2xl bg-[#161b22]/75 backdrop-blur-xl border border-emerald-500/20 hover:border-emerald-400/50 hover:shadow-[0_14px_40px_rgba(16,185,129,0.22)] p-6 sm:p-7 transition-all duration-300 will-change-transform overflow-hidden"
        >
          <div
            className="pointer-events-none absolute inset-0 rounded-2xl transition-opacity duration-300 z-0"
            style={{
              background: `radial-gradient(circle 260px at ${shine.x}% ${shine.y}%, rgba(16, 185, 129, 0.16), rgba(163, 230, 53, 0.06) 45%, transparent 75%)`,
              opacity: shine.opacity,
            }}
          />
          <div className="pointer-events-none absolute top-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-emerald-400/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 z-10" />

          <div className="relative z-10 mb-4">
            <div className="flex items-center justify-between gap-2 mb-3">
              <span className="inline-flex items-center gap-1.5 font-mono text-[11px] font-semibold uppercase tracking-wider text-lime-400 px-2.5 py-1 rounded-md bg-lime-400/10 border border-lime-400/20">
                <span className="w-1.5 h-1.5 rounded-full bg-lime-400"></span>
                {project.badge}
              </span>
              <span className="font-mono text-xs text-zinc-500 group-hover:text-emerald-400/80 transition-colors">
                {project.index}
              </span>
            </div>

            <h3 className="text-xl font-bold tracking-tight text-white group-hover:text-emerald-300 transition-colors duration-200 mb-2.5">
              {project.title}
            </h3>

            <p className="text-sm text-zinc-300 leading-relaxed font-normal">
              {project.description}

    // --- Interactive Skill Badge Component ---
    function SkillPill({ skill }) {
      const [isHovered, setIsHovered] = useState(false);

      const getLevelBadge = (level) => {
        switch (level) {
          case 'Proficient':
            return {
              text: 'text-emerald-300',
              dot: 'bg-emerald-400',
              border: 'border-emerald-500/40',
              bg: 'bg-emerald-950/95',
            };
          case 'Familiar':
            return {
              text: 'text-lime-300',
              dot: 'bg-lime-400',
              border: 'border-lime-500/40',
              bg: 'bg-lime-950/95',
            };
          case 'Currently Learning':
          default:
            return {
              text: 'text-teal-300',
              dot: 'bg-teal-400',
              border: 'border-teal-500/40',
              bg: 'bg-teal-950/95',
            };
        }
      };

      const levelStyle = getLevelBadge(skill.level);

      return (
        <div
          className="relative flex items-center"
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => setIsHovered(false)}
        >
          <div
            className={`absolute -top-10 left-1/2 -translate-x-1/2 pointer-events-none transition-all duration-200 z-30 whitespace-nowrap ${
              isHovered ? 'opacity-100 -translate-y-1 scale-100' : 'opacity-0 translate-y-2 scale-95'
            }`}
          >
            <div
              className={`flex items-center gap-1.5 px-2.5 py-1 rounded-lg ${levelStyle.bg} ${levelStyle.border} border shadow-[0_4px_15px_rgba(0,0,0,0.8)] backdrop-blur-md`}
            >
              <span className={`w-1.5 h-1.5 rounded-full ${levelStyle.dot} animate-pulse`} />
              <span className={`font-mono text-[10px] font-semibold uppercase tracking-wider ${levelStyle.text}`}>
                {skill.level}
              </span>
              <div className="absolute top-full left-1/2 -translate-x-1/2 -mt-[1px] border-solid border-t-emerald-950 border-t-4 border-x-transparent border-x-4 border-b-0" />
            </div>
          </div>

          <button
            type="button"
            className={`group relative flex items-center gap-2.5 px-3.5 py-2 rounded-xl bg-[#161b22]/70 hover:bg-[#161b22] border transition-all duration-200 cursor-pointer select-none ${
              isHovered

          </button>
